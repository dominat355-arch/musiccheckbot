services:
  - type: web
    name: musiccheck-web
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ACRCLOUD_HOST
        sync: false
      - key: ACRCLOUD_ACCESS_KEY
        sync: false
      - key: ACRCLOUD_ACCESS_SECRET
        sync: false
      - key: AUDD_API_TOKEN
        sync: false
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      - key: GENIUS_ACCESS_TOKEN
        sync: false
    buildFilter:
      paths:
        - "**/*.py"
        - "requirements.txt"
        - "templates/**"
    healthCheckPath: /health
    apt:
      - ffmpeg
